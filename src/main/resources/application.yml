server:
  port: 8080

spring:
  application:
    name: raspi-ai-agent

  # ==== PostgreSQL ====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    username: ${DB_USER:agent_admin}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5     # 라즈베리파이 저사양 고려
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ==== Redis (3.2+부터 spring.data.redis 사용) ====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
      timeout: 3000ms

  # ==== Spring AI (GoogleAI) ====
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY:}
        chat:
          model: gemini-3.6-flash   # 실제 사용 가능한 모델명은 최신 문서에서 확인 필요
          options:
            temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.ai: INFO
    com.example: DEBUG