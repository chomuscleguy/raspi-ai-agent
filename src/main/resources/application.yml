server:
  port: 8080

spring:
  application:
    name: raspi-ai-agent

  # ==== PostgreSQL ====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    username: ${DB_USER:agent_admin}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ==== Redis (3.2+부터 spring.data.redis 사용) ====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
      timeout: 3000ms

  # ==== Spring AI ====
  ai:
    model:
      chat: ${AI_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY:}
        chat:
          options:
            model: ${AI_MODEL:gemini-3.6-flash}
            temperature: 0.7
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.ai: INFO